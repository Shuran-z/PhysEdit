<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a808a"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6fd6"/></marker>
    <linearGradient id="viridis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#440154"/><stop offset="0.35" stop-color="#31688e"/><stop offset="0.7" stop-color="#35b779"/><stop offset="1" stop-color="#fde725"/>
    </linearGradient>
  </defs>
  <rect width="860" height="450" fill="#fff"/>

  <!-- shared input -->
  <text x="91" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Generated video</text>
  <rect x="44" y="212" width="112" height="74" fill="#fff" stroke="#c3c8d0"/>
  <rect x="38" y="218" width="112" height="74" fill="#fff" stroke="#c3c8d0"/>
  <rect x="32" y="224" width="112" height="74" fill="#fff" stroke="#8d939c"/>
  <line x1="38" y1="288" x2="138" y2="288" stroke="#c9cdd4" stroke-width="2"/>
  <path d="M52,244 Q86,214 132,284" fill="none" stroke="#e07a2e" stroke-width="1.4" stroke-dasharray="3,3"/>
  <rect x="46" y="238" width="11" height="11" fill="none" stroke="#e07a2e" stroke-width="1.6"/>
  <rect x="72" y="226" width="11" height="11" fill="none" stroke="#e07a2e" stroke-width="1.6"/>
  <rect x="98" y="234" width="11" height="11" fill="none" stroke="#e07a2e" stroke-width="1.6"/>
  <rect x="120" y="262" width="11" height="11" fill="none" stroke="#e07a2e" stroke-width="1.6"/>
  <text x="88" y="318" text-anchor="middle" font-size="12" fill="#666">tracked boxes</text>
  <path d="M150,255 C176,255 172,125 196,125" fill="none" stroke="#7a808a" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M150,255 C172,255 176,249 196,249" fill="none" stroke="#7a808a" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M150,255 C176,255 172,373 196,373" fill="none" stroke="#2a6fd6" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- row: 2D box fitting -->
  <g transform="translate(0,70)">
    <rect x="200" y="0" width="640" height="110" rx="8" fill="#f5f6f8" stroke="#d5d9e0"/>
    <text x="216" y="26" font-size="14" font-weight="bold" fill="#333">2D box fitting</text>
    <line x1="366" y1="84" x2="446" y2="84" stroke="#8d939c"/><line x1="366" y1="84" x2="366" y2="38" stroke="#8d939c"/>
    <path d="M372,48 Q404,24 442,80" fill="none" stroke="#e07a2e" stroke-width="2"/>
    <g fill="#333"><circle cx="375" cy="47" r="2.6"/><circle cx="393" cy="40" r="2.6"/><circle cx="411" cy="42" r="2.6"/><circle cx="427" cy="55" r="2.6"/><circle cx="439" cy="74" r="2.6"/></g>
    <text x="405" y="103" text-anchor="middle" font-size="12" fill="#666">image-plane fit</text>
    <line x1="458" y1="62" x2="490" y2="62" stroke="#7a808a" stroke-width="1.4" marker-end="url(#ag)"/>
    <rect x="500" y="52" width="86" height="20" fill="#fff" stroke="#8d939c"/>
    <g stroke="#8d939c"><line x1="508" y1="52" x2="508" y2="62"/><line x1="518" y1="52" x2="518" y2="58"/><line x1="528" y1="52" x2="528" y2="62"/><line x1="538" y1="52" x2="538" y2="58"/><line x1="548" y1="52" x2="548" y2="62"/><line x1="558" y1="52" x2="558" y2="58"/><line x1="568" y1="52" x2="568" y2="62"/><line x1="578" y1="52" x2="578" y2="58"/></g>
    <text x="543" y="103" text-anchor="middle" font-size="12" fill="#666">pixel scale</text>
    <line x1="598" y1="62" x2="750" y2="62" stroke="#7a808a" stroke-width="1.4" marker-end="url(#ag)"/>
    <text x="796" y="68" text-anchor="middle" font-size="18" fill="#333">g</text>
  </g>

  <!-- row: Depth lifting -->
  <g transform="translate(0,194)">
    <rect x="200" y="0" width="640" height="110" rx="8" fill="#f5f6f8" stroke="#d5d9e0"/>
    <text x="216" y="26" font-size="14" font-weight="bold" fill="#333">Depth lifting</text>
    <rect x="362" y="38" width="86" height="48" fill="url(#viridis)"/>
    <rect x="398" y="54" width="14" height="12" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text x="405" y="103" text-anchor="middle" font-size="12" fill="#666">monocular depth</text>
    <line x1="458" y1="62" x2="490" y2="62" stroke="#7a808a" stroke-width="1.4" marker-end="url(#ag)"/>
    <line x1="508" y1="84" x2="586" y2="84" stroke="#8d939c"/><line x1="508" y1="84" x2="508" y2="38" stroke="#8d939c"/><line x1="508" y1="84" x2="532" y2="68" stroke="#8d939c"/>
    <path d="M514,48 Q546,28 580,80" fill="none" stroke="#31688e" stroke-width="2"/>
    <g fill="#333"><circle cx="517" cy="46" r="2.6"/><circle cx="536" cy="38" r="2.6"/><circle cx="555" cy="44" r="2.6"/><circle cx="571" cy="62" r="2.6"/></g>
    <text x="547" y="103" text-anchor="middle" font-size="12" fill="#666">3D trajectory fit</text>
    <line x1="598" y1="62" x2="750" y2="62" stroke="#7a808a" stroke-width="1.4" marker-end="url(#ag)"/>
    <text x="796" y="68" text-anchor="middle" font-size="18" fill="#333">g</text>
  </g>

  <!-- row: Simulator inversion, ours -->
  <g transform="translate(0,318)">
    <rect x="200" y="0" width="640" height="110" rx="8" fill="#eaf2fd" stroke="#2a6fd6" stroke-width="1.6"/>
    <text x="216" y="26" font-size="14" font-weight="bold" fill="#1d58b5">Simulator inversion · ours</text>
    <rect x="372" y="34" width="80" height="46" fill="#fff" stroke="#9fb9e3"/>
    <rect x="367" y="38" width="80" height="46" fill="#fff" stroke="#9fb9e3"/>
    <rect x="362" y="42" width="80" height="46" fill="#fff" stroke="#2a6fd6"/>
    <polygon points="368,82 436,82 436,58" fill="#dfe8f6" stroke="#2a6fd6"/>
    <polygon points="404,70 414,64 418,71 408,77" fill="#2a6fd6"/>
    <text x="405" y="103" text-anchor="middle" font-size="12" fill="#1d58b5">re-simulate θ₁ … θₖ</text>
    <line x1="458" y1="62" x2="490" y2="62" stroke="#2a6fd6" stroke-width="1.4" marker-end="url(#ab)"/>
    <rect x="500" y="38" width="86" height="48" fill="#fff" stroke="#2a6fd6"/>
    <path d="M510,52 Q540,34 578,80" fill="none" stroke="#2a6fd6" stroke-width="1.2" stroke-dasharray="3,3"/>
    <g fill="none" stroke-width="1.6">
      <rect x="506" y="47" width="10" height="10" stroke="#e07a2e"/><rect x="530" y="41" width="10" height="10" stroke="#e07a2e"/><rect x="556" y="52" width="10" height="10" stroke="#e07a2e"/>
      <rect x="508" y="49" width="10" height="10" stroke="#2a6fd6"/><rect x="532" y="43" width="10" height="10" stroke="#2a6fd6"/><rect x="558" y="54" width="10" height="10" stroke="#2a6fd6"/>
    </g>
    <text x="543" y="103" text-anchor="middle" font-size="12" fill="#1d58b5">render and compare</text>
    <line x1="596" y1="62" x2="628" y2="62" stroke="#2a6fd6" stroke-width="1.4" marker-end="url(#ab)"/>
    <line x1="640" y1="84" x2="718" y2="84" stroke="#8d939c"/><line x1="640" y1="84" x2="640" y2="38" stroke="#8d939c"/>
    <rect x="670" y="40" width="20" height="44" fill="#2a6fd6" fill-opacity="0.18"/>
    <path d="M646,40 Q680,128 714,40" fill="none" stroke="#2a6fd6" stroke-width="2"/>
    <line x1="680" y1="40" x2="680" y2="84" stroke="#1d58b5" stroke-dasharray="3,2"/>
    <text x="679" y="103" text-anchor="middle" font-size="12" fill="#1d58b5">loss over θ</text>
    <line x1="724" y1="62" x2="750" y2="62" stroke="#2a6fd6" stroke-width="1.4" marker-end="url(#ab)"/>
    <text x="796" y="62" text-anchor="middle" font-size="18" fill="#1d58b5">g, μ, v</text>
    <text x="796" y="82" text-anchor="middle" font-size="12" fill="#1d58b5">± band</text>
  </g>

</svg>
