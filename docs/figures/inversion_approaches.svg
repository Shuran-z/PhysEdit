<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect width="1020" height="360" fill="#ffffff"/>

  <!-- (a) 2D bounding box -->
  <g transform="translate(20,20)">
    <rect width="300" height="320" rx="10" fill="#f6f6f6" stroke="#d0d0d0"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#222">2D bounding box</text>
    <rect x="16" y="48" width="120" height="84" fill="#fff" stroke="#999"/>
    <rect x="30" y="60" width="16" height="14" fill="none" stroke="#e07a2e" stroke-width="1.6"/>
    <rect x="58" y="70" width="16" height="14" fill="none" stroke="#e07a2e" stroke-width="1.6" opacity="0.8"/>
    <rect x="84" y="88" width="16" height="14" fill="none" stroke="#e07a2e" stroke-width="1.6" opacity="0.65"/>
    <rect x="106" y="112" width="16" height="14" fill="none" stroke="#e07a2e" stroke-width="1.6" opacity="0.5"/>
    <text x="76" y="148" text-anchor="middle" fill="#555">tracked boxes</text>
    <line x1="142" y1="90" x2="170" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="176" y="48" width="108" height="84" fill="#fff" stroke="#999"/>
    <path d="M186,60 Q232,40 274,124" fill="none" stroke="#e07a2e" stroke-width="2"/>
    <circle cx="190" cy="58" r="2.5" fill="#333"/><circle cx="214" cy="54" r="2.5" fill="#333"/>
    <circle cx="238" cy="64" r="2.5" fill="#333"/><circle cx="258" cy="88" r="2.5" fill="#333"/><circle cx="271" cy="116" r="2.5" fill="#333"/>
    <text x="230" y="148" text-anchor="middle" fill="#555">image-plane parabola</text>
    <text x="16" y="184" fill="#222">g = pixel acceleration × metres / pixel</text>
    <text x="16" y="204" fill="#555">scale from object size or depth</text>
    <text x="16" y="242" fill="#555">✓ simple, no 3D needed</text>
    <text x="16" y="264" fill="#555">✗ free flight and gravity only</text>
    <text x="16" y="286" fill="#555">✗ perspective and scale errors</text>
  </g>

  <!-- (b) Depth lifting -->
  <g transform="translate(360,20)">
    <rect width="300" height="320" rx="10" fill="#f6f6f6" stroke="#d0d0d0"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#222">Depth lifting</text>
    <defs>
      <linearGradient id="depth" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2b2b6e"/><stop offset="0.5" stop-color="#3d8fb8"/><stop offset="1" stop-color="#e6d35c"/>
      </linearGradient>
    </defs>
    <rect x="16" y="48" width="120" height="84" fill="url(#depth)" stroke="#999"/>
    <rect x="70" y="80" width="18" height="16" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text x="76" y="148" text-anchor="middle" fill="#555">depth model per frame</text>
    <line x1="142" y1="90" x2="170" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="176" y="48" width="108" height="84" fill="#fff" stroke="#999"/>
    <line x1="194" y1="122" x2="194" y2="58" stroke="#bbb"/><line x1="194" y1="122" x2="274" y2="122" stroke="#bbb"/>
    <line x1="194" y1="122" x2="222" y2="104" stroke="#bbb"/>
    <path d="M200,66 Q238,52 268,116" fill="none" stroke="#3d8fb8" stroke-width="2"/>
    <circle cx="204" cy="64" r="2.5" fill="#333"/><circle cx="228" cy="58" r="2.5" fill="#333"/><circle cx="250" cy="74" r="2.5" fill="#333"/><circle cx="265" cy="104" r="2.5" fill="#333"/>
    <text x="230" y="148" text-anchor="middle" fill="#555">3D trajectory</text>
    <text x="16" y="184" fill="#222">fit g along the gravity direction</text>
    <text x="16" y="204" fill="#555">DepthPro, MoGe-2, VGGT, …</text>
    <text x="16" y="242" fill="#555">✓ metric 3D from a single view</text>
    <text x="16" y="264" fill="#555">✗ depth noise and scale drift</text>
    <text x="16" y="286" fill="#555">✗ no contact or friction model</text>
  </g>

  <!-- (c) Simulator inversion (ours) -->
  <g transform="translate(700,20)">
    <rect width="300" height="320" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="16" y="28" font-size="15" font-weight="bold" fill="#1d5aa6">Simulator inversion · ours</text>
    <rect x="16" y="48" width="74" height="84" fill="#fff" stroke="#999"/>
    <rect x="26" y="96" width="54" height="6" fill="#bbb"/>
    <rect x="44" y="78" width="16" height="16" fill="none" stroke="#2a78d6" stroke-width="1.6"/>
    <text x="53" y="148" text-anchor="middle" fill="#555">scene at</text>
    <text x="53" y="163" text-anchor="middle" fill="#555">condition frame</text>
    <line x1="94" y1="90" x2="112" y2="90" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arrb)"/>
    <g fill="#fff" stroke="#999">
      <rect x="118" y="48" width="66" height="22"/><rect x="118" y="77" width="66" height="22"/><rect x="118" y="106" width="66" height="22"/>
    </g>
    <text x="151" y="63" text-anchor="middle" fill="#333">θ₁</text><text x="151" y="92" text-anchor="middle" fill="#333">θ₂</text><text x="151" y="121" text-anchor="middle" fill="#333">θₖ</text>
    <text x="151" y="148" text-anchor="middle" fill="#555">re-simulate,</text>
    <text x="151" y="163" text-anchor="middle" fill="#555">project boxes</text>
    <line x1="188" y1="90" x2="206" y2="90" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arrb)"/>
    <rect x="212" y="48" width="74" height="84" fill="#fff" stroke="#999"/>
    <path d="M220,62 Q249,150 278,58" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <line x1="238" y1="66" x2="238" y2="126" stroke="#2a78d6" stroke-opacity="0.25" stroke-width="10"/>
    <line x1="249" y1="58" x2="249" y2="128" stroke="#1d5aa6" stroke-dasharray="3,2"/>
    <text x="249" y="148" text-anchor="middle" fill="#555">box loss vs</text>
    <text x="249" y="163" text-anchor="middle" fill="#555">SAM 3.1 tracks</text>
    <text x="16" y="196" fill="#222">estimate θ + calibrated uncertainty band</text>
    <text x="16" y="216" fill="#555">θ: gravity g, friction μ or initial speed v</text>
    <text x="16" y="250" fill="#555">✓ same scene, contacts, friction, collisions</text>
    <text x="16" y="272" fill="#555">✓ g, μ and v; "not explained" when no θ fits</text>
    <text x="16" y="294" fill="#555">✓ validated on known-truth videos</text>
  </g>
</svg>
